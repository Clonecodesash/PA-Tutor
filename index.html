<style>
body{margin:0}
[hidden]{display:none!important}

/* Layout: colonna unica — testata, percorso a 7 livelli, pannello domanda o scheda di risposta. */
:root {
  --bg: #F3F6F7; --surface: #FFFFFF; --ink: #13252D; --muted: #56676F; --line: #D6DFE3;
  --accent: #0A6A86; --accent-ink: #FFFFFF; --accent-soft: #E0EFF3;
  --yel-bg: #FBF0C4; --yel-ink: #5E4900; --grn-bg: #DCEFE0; --grn-ink: #1C5A2D;
  --warn: #A9481A; --warn-soft: #FBE8DD;
  --f-ui: "Titillium Web", "Segoe UI", system-ui, sans-serif;
  --f-code: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E191E; --surface: #15242B; --ink: #E4EDF0; --muted: #93A6AE; --line: #2A3D45;
  --accent: #5BBFDA; --accent-ink: #08212A; --accent-soft: #15394A;
  --yel-bg: #3A3117; --yel-ink: #F0D676; --grn-bg: #17331F; --grn-ink: #9CD7AB;
  --warn: #F1A174; --warn-soft: #3A2418; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E191E; --surface: #15242B; --ink: #E4EDF0; --muted: #93A6AE; --line: #2A3D45;
  --accent: #5BBFDA; --accent-ink: #08212A; --accent-soft: #15394A;
  --yel-bg: #3A3117; --yel-ink: #F0D676; --grn-bg: #17331F; --grn-ink: #9CD7AB;
  --warn: #F1A174; --warn-soft: #3A2418; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--f-ui); }
.wrap { max-width: 920px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between;
  padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.brand h1 { margin: 0; font-size: 1.75rem; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-weight: 600; font-size: .92rem; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { color: var(--accent-ink); filter: brightness(1.08); }
.src { font-size: .8rem; color: var(--muted); }

/* Percorso */
ol.trail { list-style: none; padding: 0; margin: 20px 0 24px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.trail li { min-width: 0; }
.trail button, .trail span.step { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 0 0;
  border-top: 3px solid var(--line); color: var(--muted); font-size: .78rem; line-height: 1.3; }
.trail .n { display: block; font-family: var(--f-code); font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; }
.trail .v { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink); font-weight: 600; }
.trail .done button { border-top-color: var(--accent); }
.trail .done button:hover .v { color: var(--accent); text-decoration: underline; }
.trail .now span.step { border-top-color: var(--ink); }
.trail .skip span.step { border-top-style: dashed; }
@media (max-width: 640px) {
  ol.trail { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 4px; }
  .trail li { flex: 0 0 104px; }
}

/* Domanda */
.eyebrow { font-family: var(--f-code); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
h2.q { font-size: 1.5rem; line-height: 1.25; margin: 0 0 18px; font-weight: 700; text-wrap: balance; max-width: 40ch; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px; }
.opt:hover { border-color: var(--accent); background: var(--accent-soft); }
.opt .t { font-weight: 600; font-size: 1.05rem; line-height: 1.35; }
.opt .d { grid-column: 1; color: var(--muted); font-size: .9rem; }
.opt .go { grid-row: 1 / span 2; grid-column: 2; color: var(--accent); font-size: 1.3rem; }
.back { margin-top: 18px; background: none; border: 0; color: var(--muted); padding: 4px 0; font-weight: 600; }
.back:hover { color: var(--accent); }

/* Scheda */
.card-head { display: grid; gap: 6px; margin-bottom: 18px; }
.card-head h2 { margin: 0; font-size: 1.6rem; line-height: 1.2; text-wrap: balance; }
.card-head .asked { color: var(--muted); margin: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { font-size: .78rem; border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; color: var(--muted); background: var(--surface); }
.chip.st-Completa { color: var(--grn-ink); background: var(--grn-bg); border-color: transparent; }
.chip.st-Bozza { color: var(--yel-ink); background: var(--yel-bg); border-color: transparent; }
.chip.st-Da { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.notice { background: var(--warn-soft); color: var(--ink); border-radius: var(--r); padding: 10px 14px; font-size: .92rem; margin-bottom: 14px; }
.mods { display: grid; gap: 14px; }
.mod { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.mod > h3 { margin: 0; padding: 8px 16px; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 700;
  display: flex; justify-content: space-between; gap: 10px; }
.mod > h3 small { font-family: var(--f-code); font-weight: 500; letter-spacing: 0; text-transform: none; opacity: .8; }
.mod .body { padding: 12px 16px 14px; }
.mod ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.mod p { margin: 0 0 6px; } .mod p:last-child { margin-bottom: 0; }
.m-alc > h3 { background: var(--accent); color: var(--accent-ink); }
.m-gen > h3 { background: var(--accent-soft); color: var(--ink); }
.m-yel { border-color: transparent; } .m-yel > h3 { background: var(--yel-bg); color: var(--yel-ink); }
.m-grn { border-color: transparent; } .m-grn > h3 { background: var(--grn-bg); color: var(--grn-ink); }
.m-yel .body { border: 1px solid var(--yel-bg); border-top: 0; border-radius: 0 0 var(--r) var(--r); }
.m-grn .body { border: 1px solid var(--grn-bg); border-top: 0; border-radius: 0 0 var(--r) var(--r); }
.m-warn > h3 { background: var(--warn-soft); color: var(--warn); }
.m-ex > h3, .m-you > h3 { background: var(--bg); color: var(--muted); border-bottom: 1px solid var(--line); }
.m-next { border: 2px solid var(--accent); }
.m-next > h3 { color: var(--accent); }
.m-next .body { display: grid; gap: 8px; padding-top: 4px; }
.nextlink { text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0 2px; font-weight: 600; display: flex; gap: 10px; }
.nextlink:first-child { border-top: 0; }
.nextlink:hover { color: var(--accent); }
.nextlink .ramo { font-family: var(--f-code); font-size: .72rem; color: var(--muted); padding-top: 3px; white-space: nowrap; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.foot { margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--line); font-size: .82rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: space-between; }
code, .code { font-family: var(--f-code); font-size: .82em; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: .9rem; }
@media (prefers-reduced-motion: no-preference) { .panel { animation: in .18s ease-out; } @keyframes in { from { transform: translateY(4px); opacity: .6 } } }
@media print { header.top .tools, ol.trail, .actions, .back, #toast { display: none !important; } body { background: #fff; } }
</style>

 "POST", "Livello": 5, "Padre": "Q-D", "Testo": "Come comunico il cantiere e sensibilizzo cittadini e scuole?", "Area": "D · Gara e cantiere", "Fase": "Fase 5", "Domanda_figli": "", "Scheda": "S-QD3", "Evidenzia": ""}, {"ID": "Q-E", "Ramo": "POST", "Livello": 4, "Padre": "POST", "Testo": "Come chiudo l'intervento, comunico i risultati e garantisco la manutenzione?", "Area": "E · Chiusura e manutenzione", "Fase": "Fase 6", "Domanda_figli": "Più nel dettaglio, quale di queste domande ti serve?", "Scheda": "", "Evidenzia": ""}, {"ID": "Q-E1", "Ramo": "POST", "Livello": 5, "Padre": "Q-E", "Testo": "Come si chiude formalmente il progetto e cosa devo comunicare?", "Area": "E · Chiusura e manutenzione", "Fase": "Fase 6", "Domanda_figli": "", "Scheda": "S-QE1", "Evidenzia": ""}, {"ID": "Q-E2", "Ramo": "POST", "Livello": 5, "Padre": "Q-E", "Testo": "Come imposto il monitoraggio e la valutazione dell'impatto?", "Area": "E · Chiusura e manutenzione", "Fase": "Fase 6", "Domanda_figli": "", "Scheda": "S-QE2", "Evidenzia": ""}, {"ID": "Q-E3", "Ramo": "POST", "Livello": 5, "Padre": "Q-E", "Testo": "Chi è responsabile della manutenzione e con quali accordi?", "Area": "E · Chiusura e manutenzione", "Fase": "Fase 6", "Domanda_figli": "", "Scheda": "S-QE3", "Evidenzia": ""}], "schede": [{"ID": "S-A1", "Titolo": "Opera fisica o attività soft?", "Stato": "Completa", "Focus_ALCOTRA": "ALCOTRA finanzia sia azioni \"soft\" (studi, modelli di governance, Living Lab, strumenti di sensibilizzazione) sia investimenti e opere fisiche.\nLe opere sono ammesse solo se hanno scala locale o pilota e non sono infrastrutture ordinarie di rilevanza puramente nazionale.", "Principio_generale": "Ogni programma elenca nel bando le tipologie di azione e di spesa ammissibili (studi, servizi, lavori, attrezzature).\nVerifica la sezione sulle azioni ammissibili e gli eventuali tetti alle spese per lavori e infrastrutture.", "Norme_atti": "", "Processo": "", "Avvertenze": "Un'opera ordinaria presentata come progetto europeo, senza carattere pilota, rischia la non ammissibilità.", "Esempio_pilota": "", "Prossime": "P-A2\nP-A3", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG2 (Guida alla progettazione), Fase 1", "Ultima_verifica": "2026-10-28"}, {"ID": "S-A2", "Titolo": "Infrastruttura o intervento pilota?", "Stato": "Completa", "Focus_ALCOTRA": "ALCOTRA finanzia interventi PILOTA, dimostrativi e transfrontalieri.", "Principio_generale": "Distingui tra programmi di cooperazione (Interreg), che chiedono carattere pilota e trasferibile, e fondi per investimenti (es. PNRR, programmi regionali FESR), che possono finanziare infrastrutture.\nVerifica nel bando la parola chiave richiesta: \"pilota\", \"dimostrativo\", \"transfrontaliero\".", "Norme_atti": "", "Processo": "", "Avvertenze": "", "Esempio_pilota": "", "Prossime": "P-A3\nP-E1", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG2 (Guida alla progettazione), Fase 1", "Ultima_verifica": "2026-10-28"}, {"ID": "S-A3", "Titolo": "Obiettivo specifico del programma", "Stato": "Completa", "Focus_ALCOTRA": "Il perimetro tematico è l'Obiettivo Specifico 2.4: adattamento ai cambiamenti climatici e prevenzione dei rischi.", "Principio_generale": "Ogni programma è organizzato in priorità e obiettivi specifici. L'idea va collegata a uno solo di essi, in modo esplicito, già nel titolo e negli obiettivi della candidatura.", "Norme_atti": "", "Processo": "", "Avvertenze": "", "Esempio_pilota": "", "Prossime": "P-D1\nP-B1", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG2 (Guida alla progettazione), Fase 1", "Ultima_verifica": "2026-10-28"}, {"ID": "S-B1", "Titolo": "Contributo europeo e quota dell'ente", "Stato": "Completa", "Focus_ALCOTRA": "Il contributo dell'Unione Europea copre l'80% delle spese ammissibili attraverso il FESR (Fondo europeo di sviluppo regionale).", "Principio_generale": "Il tasso di contributo cambia da programma a programma e talvolta per tipo di beneficiario.\nVerifica nel bando: tasso massimo di contributo, spese ammissibili, trattamento dell'IVA.", "Norme_atti": "", "Processo": "", "Avvertenze": "Le spese non ammissibili e l'IVA recuperabile restano a carico dell'ente.", "Esempio_pilota": "", "Prossime": "P-B2\nP-B3", "Nota_AMM": "In Giunta conviene presentare il costo netto per l'ente, non solo il valore totale del progetto.", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG2 (Guida alla progettazione), Fase 2", "Ultima_verifica": "2026-10-28"}, {"ID": "S-B2", "Titolo": "Cofinanziamento nazionale obbligatorio", "Stato": "Completa", "Focus_ALCOTRA": "Per i partner pubblici italiani il restante 20% è coperto dallo Stato tramite il Fondo di Rotazione IGRUE.\nNon pesa direttamente sul bilancio comunale, salvo IVA non recuperabile o spese ritenute non ammissibili.", "Principio_generale": "In altri programmi il cofinanziamento può restare in parte a carico dell'ente.\nVerifica nel bando chi copre la quota nazionale e se l'ente deve dichiarare la copertura con un atto formale.", "Norme_atti": "", "Processo": "", "Avvertenze": "", "Esempio_pilota": "", "Prossime": "P-B3", "Nota_AMM": "", "Nota_TEC": "Coordina con la ragioneria il trattamento dell'IVA: è la voce che più spesso resta a carico.", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG2 (Guida alla progettazione), Fase 2", "Ultima_verifica": "2026-10-28"}, {"ID": "S-B3", "Titolo": "Anticipo o rimborso a posteriori?", "Stato": "Completa", "Focus_ALCOTRA": "Il programma prevede un piccolo anticipo iniziale (prefinanziamento).\nIl flusso principale avviene a rimborso, dopo la rendicontazione periodica e la convalida delle spese sostenute (Domanda di rimborso).", "Principio_generale": "Quasi tutti i fondi europei funzionano a rimborso. Verifica nel bando la percentuale di anticipo e la frequenza delle domande di rimborso.", "Norme_atti": "", "Processo": "", "Avvertenze": "L'ente deve pianificare una capacità di cassa sufficiente ad anticipare le spese fino al rimborso.", "Esempio_pilota": "", "Prossime": "P-C3", "Nota_AMM": "La capacità di anticipare la spesa è una scelta politica di bilancio: va condivisa in Giunta prima della candidatura.", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "Per un piccolo comune la liquidità è spesso il vincolo principale: verifica la cassa con la ragioneria prima di candidarti.", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG2 (Guida alla progettazione), Fase 2", "Ultima_verifica": "2026-10-28"}, {"ID": "S-C1", "Titolo": "Durata del progetto", "Stato": "Completa", "Focus_ALCOTRA": "I progetti singoli (ordinari o pilota) durano di solito tra 30 e 36 mesi.", "Principio_generale": "La durata massima è indicata nel bando. Confrontala con i tempi reali di progettazione, pareri, gara e cantiere del tuo intervento.", "Norme_atti": "", "Processo": "", "Avvertenze": "Un'opera che richiede pareri lunghi (es. VIA/VINCA) può non stare nella finestra del progetto.", "Esempio_pilota": "", "Prossime": "P-C2\nP-C3", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG2 (Guida alla progettazione), Fase 3", "Ultima_verifica": "2026-10-28"}, {"ID": "S-C2", "Titolo": "Collaudo e rendicontazione finale", "Stato": "Completa", "Focus_ALCOTRA": "La scadenza coincide con la data di chiusura formale indicata nella Convenzione di sovvenzione.\nTutte le opere devono essere collaudate e le fatture pagate entro il periodo di ammissibilità.", "Principio_generale": "Verifica nel bando e nella convenzione la data di fine ammissibilità delle spese: ciò che è pagato dopo non è rimborsabile.", "Norme_atti": "", "Processo": "", "Avvertenze": "Le spese non collaudate o non pagate entro la chiusura vengono escluse dal contributo FESR.", "Esempio_pilota": "", "Prossime": "P-C3\nP-F1", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG2 (Guida alla progettazione), Fase 3", "Ultima_verifica": "2026-10-28"}, {"ID": "S-C3", "Titolo": "Scadenze intermedie", "Stato": "Completa", "Focus_ALCOTRA": "Sono previste scadenze di rendicontazione semestrali o annuali (rapporti di avvio e di avanzamento) e verifiche sul livello di spesa (regola del disimpegno automatico N+3).", "Principio_generale": "Cerca nel bando il calendario dei rapporti periodici e le soglie minime di spesa.", "Norme_atti": "", "Processo": "", "Avvertenze": "Il mancato raggiungimento degli obiettivi di spesa intermedi può portare a tagli del finanziamento.", "Esempio_pilota": "", "Prossime": "P-B3", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG2 (Guida alla progettazione), Fase 3", "Ultima_verifica": "2026-10-28"}, {"ID": "S-D1", "Titolo": "Indicatori di realizzazione e di risultato", "Stato": "Completa", "Focus_ALCOTRA": "Non basta descrivere l'opera: vanno scelti gli indicatori del programma per l'OS 2.4.\nIndicatori di realizzazione (RCO): n. di soluzioni adottate o sviluppate congiuntamente, n. di infrastrutture verdi o pilota realizzate.\nIndicatori di risultato (RCR): volumi d'acqua accumulati o risparmiati (m³), ettari di territorio protetti da rischi o siccità, popolazione che beneficia delle misure di adattamento.", "Principio_generale": "Ogni programma ha un elenco chiuso di indicatori. Scegli solo quelli misurabili con i dati che avrai davvero a disposizione.", "Norme_atti": "", "Processo": "", "Avvertenze": "", "Esempio_pilota": "", "Prossime": "P-D2", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG2 (Guida alla progettazione), Fase 4", "Ultima_verifica": "2026-10-28"}, {"ID": "S-D2", "Titolo": "DNSH e Climate Proofing", "Stato": "Completa", "Focus_ALCOTRA": "Il rispetto del principio DNSH (Do No Significant Harm) è obbligatorio: il progetto non deve danneggiare in modo significativo altri obiettivi ambientali, ad esempio biodiversità e suolo.\nPer le infrastrutture con durata superiore a 5 anni serve la verifica di Climate Proofing (Orientamenti UE 2021/C 373/01), che ne garantisca la resilienza agli eventi climatici dei successivi 30 anni.", "Principio_generale": "Il DNSH si applica a quasi tutti i fondi europei e al PNRR. Verifica nel bando quale modulo o autovalutazione è richiesta.", "Norme_atti": "", "Processo": "", "Avvertenze": "", "Esempio_pilota": "", "Prossime": "P-F1\nQ-C2", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG2 (Guida alla progettazione), Fase 4", "Ultima_verifica": "2026-10-28"}, {"ID": "S-E1", "Titolo": "Partenariato minimo", "Stato": "Completa", "Focus_ALCOTRA": "Principio dello specchio: il partenariato deve includere almeno 1 partner italiano e 1 partner francese dell'area di cooperazione ALCOTRA.", "Principio_generale": "Ogni programma fissa numero minimo di partner e paesi. Verifica anche quali tipi di ente sono ammessi come beneficiari.", "Norme_atti": "", "Processo": "", "Avvertenze": "", "Esempio_pilota": "", "Prossime": "P-E2", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG2 (Guida alla progettazione), Fase 5", "Ultima_verifica": "2026-10-28"}, {"ID": "S-E2", "Titolo": "Ruolo del Comune rispetto al Capofila", "Stato": "Completa", "Focus_ALCOTRA": "Beneficiario / Partner di progetto (PP): ruolo ideale per i comuni che realizzano l'intervento pilota sul proprio territorio, con budget e attività locali propri.\nCapofila (LP): assume la responsabilità amministrativa, legale e finanziaria dell'intero progetto verso l'Autorità di gestione.", "Principio_generale": "Il ruolo di capofila richiede strutture amministrative solide. Valuta la capacità del tuo ente prima di candidarti in quel ruolo.", "Norme_atti": "", "Processo": "", "Avvertenze": "", "Esempio_pilota": "", "Prossime": "P-B3", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "Per un piccolo comune il ruolo di Partner di progetto è di solito più sostenibile di quello di Capofila.", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG2 (Guida alla progettazione), Fase 5", "Ultima_verifica": "2026-10-28"}, {"ID": "S-F1", "Titolo": "Manutenzione dopo il progetto", "Stato": "Completa", "Focus_ALCOTRA": "L'ente pubblico deve sottoscrivere già in candidatura un impegno formale di gestione (es. delibera consiliare o accordo con il gestore del servizio idrico).\nL'impegno garantisce copertura finanziaria e manutenzione per almeno 5 anni dopo la chiusura (regola della stabilità delle operazioni FESR).", "Principio_generale": "Quasi tutti i fondi per investimenti prevedono un vincolo di stabilità dell'opera. Verifica durata e documento richiesto.", "Norme_atti": "", "Processo": "", "Avvertenze": "", "Esempio_pilota": "", "Prossime": "P-F2\nQ-E3", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG2 (Guida alla progettazione), Fase 6", "Ultima_verifica": "2026-10-28"}, {"ID": "S-F2", "Titolo": "Eredità metodologica (capitalizzazione)", "Stato": "Completa", "Focus_ALCOTRA": "I progetti devono prevedere azioni obbligatorie di capitalizzazione: strumenti operativi riutilizzabili (linee guida di processo, protocolli di gestione, matrici di replicabilità) trasferibili ad altri comuni dell'arco alpino transfrontaliero.", "Principio_generale": "Molti programmi premiano la trasferibilità. Prevedi fin dall'inizio un prodotto concreto che altri enti possano riusare.", "Norme_atti": "", "Processo": "", "Avvertenze": "", "Esempio_pilota": "", "Prossime": "P-A1", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG2 (Guida alla progettazione), Fase 6", "Ultima_verifica": "2026-10-28"}, {"ID": "S-QA1", "Titolo": "Piani e programmi da considerare", "Stato": "Bozza", "Focus_ALCOTRA": "", "Principio_generale": "", "Norme_atti": "Normativa di riferimento e articoli di legge applicabili\nPiani e linee guida regionali, nazionali ed europei da rispettare", "Processo": "Analizzare i piani strategici e di bacino\nRecuperare programmi e progetti già approvati a livello locale, provinciale, regionale o nazionale", "Avvertenze": "", "Esempio_pilota": "", "Prossime": "Q-A2", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG1 + foglio Domande LG, Fase 1", "Ultima_verifica": "2026-10-28"}, {"ID": "S-QA2", "Titolo": "Studi tecnici sull'area", "Stato": "Bozza", "Focus_ALCOTRA": "", "Principio_generale": "", "Norme_atti": "Studi specialistici obbligatori (geotecnici, idraulici, di impatto ambientale) richiesti dalla normativa", "Processo": "Svolgere o recuperare studi tecnici e analisi di vulnerabilità\nRaccogliere dati storici e di portata sul campo\nVerificare se esistono rilievi già disponibili", "Avvertenze": "", "Esempio_pilota": "", "Prossime": "Q-A3\nQ-C2", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG1 + foglio Domande LG, Fase 1", "Ultima_verifica": "2026-10-28"}, {"ID": "S-QA3", "Titolo": "Uffici e atti preliminari", "Stato": "Bozza", "Focus_ALCOTRA": "", "Principio_generale": "", "Norme_atti": "Delibere quadro, incarichi e contratti preliminari\nUffici da attivare per l'analisi di fattibilità", "Processo": "Individuare gli uffici interni ed esterni competenti\nDefinire chi firma gli atti di avvio", "Avvertenze": "", "Esempio_pilota": "", "Prossime": "Q-B1", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG1 + foglio Domande LG, Fase 1", "Ultima_verifica": "2026-10-28"}, {"ID": "S-QB1", "Titolo": "Mappatura degli stakeholder", "Stato": "Bozza", "Focus_ALCOTRA": "", "Principio_generale": "", "Norme_atti": "Mappatura formale dei soggetti pubblici e privati coinvolti, se richiesta dall'ente o dal finanziatore", "Processo": "Mappare società civile, università, pubblica amministrazione e soggetti privati\nVerificare se esiste già una mappatura da aggiornare", "Avvertenze": "", "Esempio_pilota": "", "Prossime": "Q-B2", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG1 + foglio Domande LG, Fase 2", "Ultima_verifica": "2026-10-28"}, {"ID": "S-QB2", "Titolo": "Coinvolgimento degli stakeholder", "Stato": "Bozza", "Focus_ALCOTRA": "", "Principio_generale": "", "Norme_atti": "Procedure formali di consultazione e avvisi pubblici (es. avvio del procedimento tramite stampa)", "Processo": "Interviste, focus group, questionari e Living Lab\nValidazione partecipata dei dati e della percezione del rischio\nUsare i dati sociali per valutare l'intervento dove i dati tecnici non arrivano", "Avvertenze": "", "Esempio_pilota": "", "Prossime": "Q-B3", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG1 + foglio Domande LG, Fase 2", "Ultima_verifica": "2026-10-28"}, {"ID": "S-QB3", "Titolo": "Verbalizzare le consultazioni", "Stato": "Bozza", "Focus_ALCOTRA": "", "Principio_generale": "", "Norme_atti": "Verbali ufficiali della consultazione territoriale\nDocumentazione richiesta dall'ente o dal finanziatore (delibere, fogli firma)", "Processo": "Registrare partecipanti, temi emersi e risposte date\nConservare la documentazione per la rendicontazione", "Avvertenze": "", "Esempio_pilota": "", "Prossime": "Q-C1", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG1 + foglio Domande LG, Fase 2", "Ultima_verifica": "2026-10-28"}, {"ID": "S-QC1", "Titolo": "Atti formali di approvazione", "Stato": "Bozza", "Focus_ALCOTRA": "", "Principio_generale": "", "Norme_atti": "Atti di indirizzo formali (delibera di Giunta, determinazione)\nStudi tecnici e documenti di fattibilità (DOCFAP / PFTE)\nLivello di autorizzazione richiesto (Comune, Provincia, Regione, Bacino)\nAtti ufficiali di approvazione e adozione", "Processo": "Definire ruoli e responsabilità politico-tecniche nell'approvazione\nIndividuare chi firma il progetto preliminare", "Avvertenze": "", "Esempio_pilota": "", "Prossime": "Q-C2\nQ-C4", "Nota_AMM": "La delibera di Giunta è il momento in cui la scelta tecnica diventa indirizzo politico: va preparata insieme agli uffici.", "Nota_TEC": "Verifica subito il livello di autorizzazione richiesto: determina i tempi dell'intero iter.", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG1 + foglio Domande LG, Fasi 3 e 4", "Ultima_verifica": "2026-10-28"}, {"ID": "S-C2-N2K", "Titolo": "Pareri ambientali in area protetta", "Stato": "Bozza", "Focus_ALCOTRA": "", "Principio_generale": "", "Norme_atti": "Pareri vincolanti: VIA e Valutazione di Incidenza (VINCA)\nVincolo idrogeologico\nQuadro delle autorizzazioni preliminari e dei vincoli", "Processo": "Individuare gli enti con parere vincolante (incluso l'ente gestore del Parco o del sito)\nAvviare le richieste di parere in anticipo rispetto alla gara", "Avvertenze": "Il mancato rispetto dei tempi della valutazione ambientale può bloccare il finanziamento.", "Esempio_pilot , "Principio_generale": "", "Norme_atti": "Documenti formali richiesti per la valutazione d'impatto e dove depositarli", "Processo": "Redigere un piano di monitoraggio e valutazione\nValutazione partecipata dell'impatto sul territorio (criteri tecnici e sociali)\nSensibilizzazione continua sull'uso della risorsa idrica", "Avvertenze": "", "Esempio_pilota": "", "Prossime": "Q-E3", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG1 + foglio Domande LG, Fase 6", "Ultima_verifica": "2026-10-28"}, {"ID": "S-QE3", "Titolo": "Manutenzione e accordi di gestione", "Stato": "Bozza", "Focus_ALCOTRA": "", "Principio_generale": "", "Norme_atti": "Piano formale di manutenzione ordinaria e straordinaria\nProtocolli d'intesa o accordi per gestione e monitoraggio futuri\nDocumenti di ispezione e certificati richiesti", "Processo": "Valutare la manutenzione a breve, medio e lungo termine\nIndividuare l'ente responsabile\nStudiare la sostenibilità tecnica ed economica dell'opera", "Avvertenze": "", "Esempio_pilota": "", "Prossime": "P-F1", "Nota_AMM": "", "Nota_TEC": "", "Nota_CONS": "", "Nota_PICCOLO": "", "Nota_GRANDE": "", "Nota_SOVRA": "", "Fonte": "Schema Linee Guida – LG1 + foglio Domande LG, Fase 6", "Ultima_verifica": "2026-10-28"}]};
let D, state = { profilo: null, ente: null, ramo: null, trail: [] };

const LIV = ["Profilo", "Ente", "Stato intervento", "Il tuo dubbio", "Dettaglio", "Affinamento", "Scheda"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lines = s => String(s ?? "").split(/\r?\n/).map(x => x.trim()).filter(Boolean);

function prepara(raw) {
  const nodi = new Map(raw.nodi.map(n => [String(n.ID), n]));
  const figli = new Map();
  raw.nodi.forEach(n => { const p = String(n.Padre); if (!figli.has(p)) figli.set(p, []); figli.get(p).push(n); });
  return { ingressi: raw.ingressi, nodi, figli, schede: new Map(raw.schede.map(s => [String(s.ID), s])) };
}
function ingresso(liv) { return D.ingressi.filter(i => Number(i.Livello) === liv); }
function etichetta(liv, id) { const i = D.ingressi.find(x => Number(x.Livello) === liv && x.ID === id); return i ? i.Etichetta : id; }

// ---------- Vista corrente
function vista() {
  if (!state.profilo) return { liv: 1, tipo: "ingresso" };
  if (!state.ente) return { liv: 2, tipo: "ingresso" };
  if (!state.ramo) return { liv: 3, tipo: "ingresso" };
  const cur = state.trail.length ? state.trail[state.trail.length - 1] : state.ramo;
  const kids = D.figli.get(cur) || [];
  if (kids.length) return { liv: Number(kids[0].Livello), tipo: "domanda", cur, kids };
  return { liv: 7, tipo: "scheda", cur };
}

function render() {
  const v = vista();
  renderTrail(v);
  const m = $("#main");
  if (v.tipo === "ingresso") m.innerHTML = vIngresso(v.liv);
  else if (v.tipo === "domanda") m.innerHTML = vDomanda(v);
  else m.innerHTML = vScheda(v.cur);
  m.firstElementChild?.classList.add("panel");
  window.scrollTo({ top: 0 });
}

function renderTrail(v) {
  const scelte = [
    state.profilo && etichetta(1, state.profilo),
    state.ente && etichetta(2, state.ente),
    state.ramo && (state.ramo === "PRE" ? "Pre-bando" : "Post-bando"),
  ];
  const livTrail = {};
  state.trail.forEach(id => { const n = D.nodi.get(id); if (n) livTrail[Number(n.Livello)] = n; });
  let html = "";
  for (let l = 1; l <= 7; l++) {
    let val = l <= 3 ? scelte[l - 1] : livTrail[l] ? livTrail[l].Testo : null;
    if (l === 7 && v.tipo === "scheda") val = "Risposta";
    const skipped = l === 6 && !livTrail[6] && v.tipo === "scheda" && v.liv === 7;
    const now = v.liv === l;
    const done = !!val && !now && l < 7;
    const inner = `<span class="n">${l} · ${LIV[l - 1]}</span><span class="v">${esc(skipped ? "Non necessario" : val || "")}</span>`;
    html += done ? `<li class="done"><button type="button" data-back="${l}" title="Torna a questo livello">${inner}</button></li>`
                 : `<li class="${now ? "now" : ""} ${skipped ? "skip" : ""}"><span class="step">${inner}</span></li>`;
  }
  $("#trail").innerHTML = html;
}

function vIngresso(liv) {
  const prompts = {
    1: ["Chi sei?", "Adattiamo il livello di dettaglio e le priorità delle risposte."],
    2: ["Che tipo di ente rappresenti?", "Teniamo conto della struttura e delle risorse del tuo ente."],
    3: ["A che punto è il tuo intervento?", ""],
  };
  const opts = ingresso(liv).map(i => `<button class="opt" type="button" data-in="${liv}" data-id="${esc(i.ID)}">
    <span class="t">${esc(i.Etichetta)}</span><span class="d">${esc(i.Descrizione)}</span><span class="go" aria-hidden="true">→</span></button>`).join("");
  return `<section><p class="eyebrow">Livello ${liv} di 7</p><h2 class="q">${prompts[liv][0]}</h2>
    ${prompts[liv][1] ? `<p style="margin:-10px 0 18px;color:var(--muted)">${prompts[liv][1]}</p>` : ""}
    <div class="opts">${opts}</div>${liv > 1 ? `<button class="back" type="button" data-step="-1">← Indietro</button>` : ""}</section>`;
}

function vDomanda(v) {
  const n = D.nodi.get(v.cur);
  const q = n ? n.Domanda_figli : "Quale di queste domande descrive meglio il tuo dubbio?";
  const opts = v.kids.map(k => `<button class="opt" type="button" data-node="${esc(k.ID)}">
    <span class="t">${esc(k.Testo)}</span><span class="go" aria-hidden="true">→</span></button>`).join("");
  return `<section><p class="eyebrow">Livello ${v.liv} di 7 · ${LIV[v.liv - 1]}</p><h2 class="q">${esc(q)}</h2>
    <div class="opts">${opts}</div><button class="back" type="button" data-step="-1">← Indietro</button></section>`;
}

function modulo(cls, titolo, testo, sub = "") {
  const ls = lines(testo);
  if (!ls.length) return "";
  const body = ls.length > 1 ? `<ul>${ls.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p>${esc(ls[0])}</p>`;
  return `<section class="mod ${cls}"><h3>${titolo}${sub ? `<small>${sub}</small>` : ""}</h3><div class="body">${body}</div></section>`;
}

function vScheda(id) {
  const n = D.nodi.get(id);
  const s = D.schede.get(String(n.Scheda || ""));
  const domanda = n.Livello == 6 ? D.nodi.get(String(n.Padre))?.Testo : n.Testo;
  if (!s) return `<section><p class="eyebrow">Livello 7 · Scheda di risposta</p><h2 class="q">${esc(domanda)}</h2>
    <div class="notice">La scheda per questa domanda è in preparazione. Il percorso è già attivo: il contenuto comparirà appena inserito nel file dei contenuti.</div>
    <div class="actions"><button class="btn" type="button" data-step="-1">← Indietro</button><button class="btn" type="button" data-restart>Ricomincia</button></div></section>`;

  const pre = n.Ramo === "PRE";
  const note = [["Nota_" + state.profilo, etichetta(1, state.profilo)], ["Nota_" + state.ente, etichetta(2, state.ente)]]
    .filter(([k]) => lines(s[k]).length).map(([k, who]) => `<p><strong>${esc(who)}:</strong> ${esc(lines(s[k]).join(" "))}</p>`).join("");
  let mods = "";
  if (pre) {
    const alc = modulo("m-alc", "Regola del Programma ALCOTRA / Se.Te", s.Focus_ALCOTRA);
    const gen = modulo("m-gen", "Principio generale · altri bandi", s.Principio_generale, "dove e cosa verificare");
    mods += n.Evidenzia === "GENERALE" ? gen + alc : alc + gen;
  } else {
    mods += modulo("m-yel", "Norme e atti", s.Norme_atti, "Scheda gialla");
    mods += modulo("m-grn", "Processo e operatività", s.Processo, "Scheda verde");
  }
  mods += modulo("m-warn", pre ? "Avvertenze e aspetti da considerare" : "Avvertenze e rischi di cantiere", s.Avvertenze);
  if (!pre) mods += modulo("m-ex", "Esempio reale dai 4 progetti pilota", s.Esempio_pilota);
  if (note) mods += `<section class="mod m-you"><h3>Per il tuo ruolo e il tuo ente</h3><div class="body">${note}</div></section>`;
  const next = lines(s.Prossime).map(i => D.nodi.get(i)).filter(Boolean);
  if (next.length) mods += `<section class="mod m-next"><h3>Come proseguire? <small>altre domande da porsi</small></h3><div class="body">${
    next.map(x => `<button class="nextlink" type="button" data-jump="${esc(x.ID)}"><span>${esc(x.Testo)}</span>${x.Ramo !== n.Ramo ? `<span class="ramo">${x.Ramo === "PRE" ? "PRE-BANDO" : "POST-BANDO"}</span>` : ""}</button>`).join("")}</div></section>`;

  const stato = s.Stato || "Da compilare";
  const avviso = stato === "Completa" ? "" : `<div class="notice">${stato === "Bozza"
    ? "Scheda in bozza: la struttura è definita, i contenuti vanno validati e integrati con le interviste ai progetti pilota."
    : "Scheda da compilare: sono presenti solo le indicazioni di base."}</div>`;
  const standalone = window.self === window.top;
  return `<article><div class="card-head"><p class="eyebrow">Livello 7 · Scheda di risposta · <span class="code">${esc(s.ID)}</span></p>
    <h2>${esc(s.Titolo)}</h2><p class="asked">${esc(domanda)}</p>
    <div class="meta"><span class="chip st-${esc(stato.split(" ")[0])}">${esc(stato)}</span><span class="chip">${esc(n.Area)}</span><span class="chip">${esc(n.Fase)}</span>
    ${pre ? `<span class="chip">${n.Evidenzia === "GENERALE" ? "Focus: altri bandi" : "Focus: ALCOTRA"}</span>` : ""}</div></div>
    ${avviso}<div class="mods">${mods}</div>
    <div class="actions"><button class="btn primary" type="button" data-copy>Copia la scheda</button>
    ${standalone ? `<button class="btn" type="button" data-print>Stampa / PDF</button>` : ""}
    <button class="btn" type="button" data-step="-1">← Indietro</button><button class="btn" type="button" data-restart>Ricomincia</button></div>
    <div class="foot"><span>Fonte: ${esc(s.Fonte)}</span><span>Ultima verifica: ${esc(fmtData(s.Ultima_verifica))}</span></div></article>`;
}

function fmtData(v) {
  if (typeof v === "number") { const d = new Date(Math.round((v - 25569) * 864e5)); return d.toLocaleDateString("it-IT"); }
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v)); return m ? `${m[3]}/${m[2]}/${m[1]}` : String(v || "—");
}

function testoScheda() {
  const art = $("#main article"); if (!art) return "";
  const out = [art.querySelector("h2").textContent, art.querySelector(".asked").textContent, ""];
  art.querySelectorAll(".mod").forEach(m => {
    out.push(m.querySelector("h3").childNodes[0].textContent.toUpperCase());
    m.querySelectorAll(".body li, .body p, .nextlink > span:first-child").forEach(x => out.push("- " + x.textContent));
    out.push("");
  });
  out.push(art.querySelector(".foot").textContent.replace(/\s{2,}/g, " · "));
  return out.join("\n");
}

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }

function catena(id) { const c = []; let x = D.nodi.get(id); while (x) { c.unshift(String(x.ID)); x = D.nodi.get(String(x.Padre)); } return c; }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.in) { const l = +b.dataset.in, id = b.dataset.id;
    if (l === 1) state.profilo = id; else if (l === 2) state.ente = id; else { state.ramo = id; state.trail = []; } render(); }
  else if (b.dataset.node) { state.trail.push(b.dataset.node); render(); }
  else if (b.dataset.jump) { const n = D.nodi.get(b.dataset.jump); state.ramo = n.Ramo; state.trail = catena(n.ID); render(); }
  else if (b.dataset.step) {
    if (state.trail.length) state.trail.pop(); else if (state.ramo) state.ramo = null; else if (state.ente) state.ente = null; else state.profilo = null;
    render(); }
  else if (b.dataset.back) { const l = +b.dataset.back;
    if (l === 1) { state.profilo = state.ente = state.ramo = null; state.trail = []; }
    else if (l === 2) { state.ente = state.ramo = null; state.trail = []; }
    else if (l === 3) { state.ramo = null; state.trail = []; }
    else state.trail = state.trail.filter(id => Number(D.nodi.get(id).Livello) < l);
    render(); }
  else if ("restart" in b.dataset) { state = { profilo: state.profilo, ente: state.ente, ramo: null, trail: [] }; render(); }
  else if ("print" in b.dataset) window.print();
  else if ("copy" in b.dataset) { const t = testoScheda();
    navigator.clipboard?.writeText(t).then(() => toast("Scheda copiata negli appunti"), () => toast("Copia non disponibile in questa finestra")) ?? toast("Copia non disponibile in questa finestra"); }
});

// ---------- Caricamento contenuti da Excel
function daWorkbook(wb) {
  const leggi = nome => { const ws = wb.Sheets[nome]; if (!ws) throw new Error(`Manca il foglio "${nome}"`);
    return XLSX.utils.sheet_to_json(ws, { defval: "" }).map(r => { const o = {}; for (const k in r) o[k.trim()] = typeof r[k] === "string" ? r[k].trim() : r[k]; return o; }).filter(r => r.ID !== ""); };
  return { ingressi: leggi("Ingressi"), nodi: leggi("Nodi"), schede: leggi("Schede") };
}
$("#loadBtn").onclick = () => $("#fileIn").click();
$("#fileIn").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { if (!window.XLSX) throw new Error("libreria Excel non caricata");
    D = prepara(daWorkbook(XLSX.read(await f.arrayBuffer())));
    $("#srcLabel").textContent = "Contenuti: " + f.name; state = { profilo: null, ente: null, ramo: null, trail: [] }; render(); toast("Contenuti caricati da " + f.name);
  } catch (err) { toast("File non valido: " + err.message); }
  e.target.value = "";
};

(async function avvio() {
  // Sul sito di ANCI: se contenuti.xlsx è accanto alla pagina, viene letto automaticamente.
  if (window.self === window.top && window.XLSX && location.protocol.startsWith("http")) {
    try { const r = await fetch("contenuti.xlsx", { cache: "no-store" });
      if (r.ok) { D = prepara(daWorkbook(XLSX.read(await r.arrayBuffer()))); $("#srcLabel").textContent = "Contenuti: contenuti.xlsx"; render(); return; } } catch (_) {}
  }
  D = prepara(DATI_INCORPORATI); $("#srcLabel").textContent = "Contenuti di esempio incorporati"; render();
})();
</script>
